databaseChangeLog:
  - changeSet:
      id: 3
      author: Jafarov
      changes:
        - createTable:
            tableName: carts
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_cart_user
                    references: users(id)
                    deleteCascade: true
              - column:
                  name: total_price
                  type: DOUBLE PRECISION
                  defaultValueNumeric: 0.0
                  constraints:
                    nullable: false