<!DOCTYPE html>
<html lang="az" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Səbət</title>
    <link rel="icon" type="image/png" th:href="@{/files/smilebook.png}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        .cart-empty {
            text-align: center;
            padding: 100px 20px;
            color: #999;
        }

        .cart-item {
            border-bottom: 1px solid #eee;
            padding: 15px 0;
        }

        .total-section {
            background-color: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
        }

        body.dark-mode {
            background-color: #1e1e1e;
            color: #f4f4f4;
        }

        body.dark-mode .card {
            background-color: #2a2a2a;
            color: #f4f4f4;
        }

        body.dark-mode .navbar {
            background-color: #2a2a2a !important;
        }

        body.dark-mode .total-section {
            background-color: #3a3a3a;
        }

        body.dark-mode .cart-item {
            border-bottom-color: #444;
        }

        body.dark-mode .btn-outline-danger {
            color: #dc3545;
            border-color: #dc3545;
        }

        body.dark-mode .btn-outline-danger:hover {
            background-color: #dc3545;
            color: white;
        }

        .quantity-control {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .quantity-btn {
            width: 30px;
            height: 30px;
            padding: 0;
            font-size: 18px;
        }

        .quantity-display {
            min-width: 40px;
            text-align: center;
            font-weight: bold;
        }

    </style>
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">

        <a class="navbar-brand" th:href="@{/home}">
            📚 Kitab Mağazası
        </a>

        <div class="ms-auto d-flex align-items-center gap-3">

            <div id="modeToggle"
                 onclick="toggleMode()"
                 style="font-size:22px; cursor:pointer;">
                🌑
            </div>

            <a th:href="@{/home}" class="btn btn-outline-light">
                ← Ana səhifə
            </a>

        </div>

    </div>
</nav>

<div class="container my-5">

    <h1 class="mb-4">🛒 Səbət</h1>

    <div th:if="${cart.items.isEmpty()}" class="cart-empty">

        <h2>Səbət boşdur</h2>

        <p class="text-muted">
            Hələ heç bir kitab əlavə etməmisiniz.
        </p>

        <a th:href="@{/home}" class="btn btn-primary btn-lg mt-3">
            Alış-verişə başla
        </a>

    </div>

    <div th:unless="${cart.items.isEmpty()}">

        <div class="row justify-content-between">


            <div class="col-lg-7 me-auto">

                <div class="card">

                    <div class="card-body">

                        <div th:each="item : ${cart.items}" class="cart-item">

                            <div class="row align-items-center">

                                <div class="col-md-5">

                                    <h5 th:text="${item.book.title}"></h5>

                                    <p class="text-muted mb-0"
                                       th:text="${item.book.author}"></p>

                                </div>

                                <div class="col-md-2 text-center">

                                    <span class="fw-bold"
                                          th:text="${item.price + ' AZN'}"></span>

                                </div>

                                <div class="col-md-3 text-center">

                                    <div class="quantity-control justify-content-center">

                                        <form th:action="@{/cart/update-quantity}"
                                              method="post"
                                              class="d-inline">

                                            <input type="hidden"
                                                   name="itemId"
                                                   th:value="${item.id}">

                                            <input type="hidden"
                                                   name="quantity"
                                                   th:value="${item.quantity - 1}">

                                            <button type="submit"
                                                    class="btn btn-sm btn-outline-secondary quantity-btn"
                                                    th:disabled="${item.quantity <= 1}">
                                                −
                                            </button>

                                        </form>

                                        <span class="quantity-display"
                                              th:text="${item.quantity}"></span>

                                        <form th:action="@{/cart/update-quantity}"
                                              method="post"
                                              class="d-inline">

                                            <input type="hidden"
                                                   name="itemId"
                                                   th:value="${item.id}">

                                            <input type="hidden"
                                                   name="quantity"
                                                   th:value="${item.quantity + 1}">

                                            <button type="submit"
                                                    class="btn btn-sm btn-outline-secondary quantity-btn">
                                                +
                                            </button>

                                        </form>

                                    </div>

                                </div>

                                <div class="col-md-2 text-end">

                                    <form th:action="@{/cart/remove/{id}(id=${item.id})}"
                                          method="post"
                                          class="d-inline">

                                        <button type="submit"
                                                class="btn btn-sm btn-danger">
                                            🗑️
                                        </button>

                                    </form>

                                </div>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

            <div class="col-lg-4 ms-auto">

                <div class="card">

                    <div class="card-body total-section">

                        <h4 class="mb-3">Sifariş məlumatı</h4>

                        <div class="d-flex justify-content-between mb-2">

                            <span>Məhsul sayı:</span>

                            <strong th:text="${cart.items.size()}"></strong>

                        </div>

                        <hr>

                        <div class="d-flex justify-content-between mb-3">

                            <h5>Toplam:</h5>

                            <h5 class="text-success"
                                th:text="${#numbers.formatDecimal(cart.totalPrice, 1, 2) + ' AZN'}">
                            </h5>

                        </div>

                        <button class="btn btn-success w-100 mb-2">
                            ✅ Sifarişi tamamla
                        </button>

                        <form th:action="@{/cart/clear}" method="post">

                            <button type="submit"
                                    class="btn btn-outline-danger w-100">

                                🗑️ Səbəti təmizlə

                            </button>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

<script>

    function checkModeOnLoad() {

        const savedMode = localStorage.getItem("themeMode");

        if (savedMode === "dark") {

            document.body.classList.add("dark-mode");

            document.getElementById("modeToggle").textContent = "☀️";
        }

    }

    function toggleMode() {

        document.body.classList.toggle("dark-mode");

        const isDark = document.body.classList.contains("dark-mode");

        document.getElementById("modeToggle").textContent = isDark ? "☀️" : "🌑";

        localStorage.setItem("themeMode", isDark ? "dark" : "light");

    }

    checkModeOnLoad();

</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
