<!DOCTYPE html>
<html lang="az" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Giriş</title>
    <link rel="icon" type="image/png" th:href="@{/files/smilebook.png}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            max-width: 400px;
            width: 100%;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 40px;
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header h2 {
            color: #667eea;
            font-weight: bold;
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            font-weight: bold;
        }
    </style>
</head>
<body>
<div class="login-card">
    <div class="login-header">
        <h2>📚 Kitab Mağazası</h2>
        <p class="text-muted">Daxil olun</p>
    </div>

    <div th:if="${param.success}" class="alert alert-success">
        ✅ Qeydiyyat uğurlu oldu! İndi daxil ola bilərsiniz.
    </div>

    <div th:if="${param.error}" class="alert alert-danger">
        ❌ Email və ya şifrə səhvdir!
    </div>

    <div th:if="${param.logout}" class="alert alert-info">
        ℹ️ Uğurla çıxış etdiniz.
    </div>

    <form th:action="@{/auth/login}" method="post">
        <div class="mb-3">
            <label for="username" class="form-label">Email</label>
            <input type="email" class="form-control" id="username"
                   name="username" placeholder="email@example.com" required>
        </div>

        <div class="mb-3">
            <label for="password" class="form-label">Şifrə</label>
            <input type="password" class="form-control" id="password"
                   name="password" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn btn-primary btn-login">
            Daxil ol
        </button>
    </form>

    <div class="text-center mt-3">
        <p class="mb-0">Hesabınız yoxdur?
            <a th:href="@{/auth/register}" class="text-decoration-none fw-bold">
                Qeydiyyatdan keçin
            </a>
        </p>
        <a th:href="@{/home}" class="text-muted text-decoration-none mt-2 d-block">
            ← Ana səhifəyə qayıt
        </a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
