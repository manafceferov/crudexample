<!DOCTYPE html>
<html lang="az" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${book.title} + ' - Ətraflı'">Kitab Ətraflı</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body.dark-mode { background-color: #1e1e1e; color: #f4f4f4; }
        body.dark-mode .card { background-color: #2a2a2a; color: #f4f4f4; }

        .mode-toggle {
            position: fixed; top: 10px; right: 20px;
            font-size: 24px; cursor: pointer;
            z-index: 1000;
        }
    </style>
</head>
<body>

<div class="mode-toggle" id="modeToggle" onclick="toggleMode()">🌑</div>

<div class="container my-5">
    <a href="/home" class="btn btn-secondary mb-4">⬅ Geri Qayıt</a>

    <div class="card p-4">
        <h2 th:text="${book.title}">Kitab Adı</h2>
        <p><strong>Müəllif:</strong> <span th:text="${book.author}">Müəllif</span></p>
        <p><strong>Qiymət:</strong> <span th:text="${book.price}">0</span> AZN</p>
    </div>
</div>

<script>
    function checkModeOnLoad() {
        const savedMode = localStorage.getItem("themeMode");
        if (savedMode === "dark") {
            document.body.classList.add("dark-mode");
            document.getElementById("modeToggle").textContent = "☀️";
        }
    }
    function toggleMode() {
        document.body.classList.toggle("dark-mode");
        const isDark = document.body.classList.contains("dark-mode");
        document.getElementById("modeToggle").textContent = isDark ? "☀️" : "🌑";
        localStorage.setItem("themeMode", isDark ? "dark" : "light");
    }
    checkModeOnLoad();
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
