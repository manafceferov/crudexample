<!DOCTYPE html>
<html lang="az" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Kitab Siyahısı</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .book-card { transition: transform 0.2s; }
        .book-card:hover { transform: scale(1.05); }
    </style>
</head>
<body>
<div class="container my-5">
    <h1 class="text-center mb-4">Kitablar</h1>
    <div class="row row-cols-1 row-cols-md-3 g-4">
        <div class="col" th:each="book : ${books}">
            <div class="card book-card h-100">
                <div class="card-body">
                    <h5 class="card-title" th:text="${book.title}">Kitab Adı</h5>
                    <p class="card-text" th:text="${book.author}">Müəllif</p>
                    <p class="card-text" th:text="${book.price} + ' AZN'">Qiymət</p>
                    <a th:href="@{/books/{id}(id=${book.id})}" class="btn btn-primary">Ətraflı</a>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
