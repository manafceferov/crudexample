spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/bookdb
    username: quizuser
    password: quizpassword
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  liquibase:
    change-log: classpath:db/db.changelog-master.yml

server:
  port: 3333

jackson:
  serialization:
    indent-output: true
