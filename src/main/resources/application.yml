spring:
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 60000
  cache:
    type: redis

  datasource:
    url: jdbc:postgresql://localhost:5433/bookdb
    username: quizuser
    password: quizpassword
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  liquibase:
    change-log: classpath:db/db.changelog-master.yml

server:
  port: 3333

# Redis cache-in nə vaxt işlədiyini dəqiq görmək üçün
logging:
  level:
    org.springframework.cache: TRACE